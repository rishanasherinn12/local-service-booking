{% extends "base_customer.html" %}
{% block title %}Booking Step1 | Local Services{% endblock %}

    {% block content %}
            <div style="max-width: 800px; margin: 0 auto;">
                <!-- Stepper -->
                <div class="flex justify-between items-center" style="margin-bottom: 3rem; position: relative;">
                    <div
                        style="position: absolute; top: 50%; left: 0; width: 100%; height: 2px; background: #E2E8F0; z-index: 0;">
                    </div>

                    <div
                        style="position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; gap: 0.5rem;">
                        <div
                            style="width: 40px; height: 40px; background: var(--color-primary); color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold;">
                            1</div>
                        <span class="text-sm font-bold">Schedule</span>
                    </div>

                    <div
                        style="position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; gap: 0.5rem;">
                        <div
                            style="width: 40px; height: 40px; background: white; border: 2px solid #E2E8F0; color: #94A3B8; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold;">
                            2</div>
                        <span class="text-sm text-light">Address</span>
                    </div>

                    <div
                        style="position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; gap: 0.5rem;">
                        <div
                            style="width: 40px; height: 40px; background: white; border: 2px solid #E2E8F0; color: #94A3B8; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold;">
                            3</div>
                        <span class="text-sm text-light">Payment</span>
                    </div>
                </div>

                <form method = "post">
                    {% csrf_token %}

                    <input type="hidden" name="booking_date" id="booking_date">
                    <input type="hidden" name="booking_time" id="booking_time">
                <!-- Content -->
                <h2 style="margin-bottom: 2rem;">When should the professional arrive?</h2>

                <div class="card" style="margin-bottom: 2rem;">

                    <h4 style="margin-bottom: 1rem;">Select Date</h4>
                    <div class="flex gap-md" style="margin-bottom: 2rem; overflow-x: auto;">

                        <button type ="button" class="btn btn-outline" onclick="selectDate('{{ today|date:'Y-m-d' }}',this)">
                            <span>Today</span>
                            <span class="text-lg font-bold">{{ today|date:"d M"}}</span>
                        </button>

                        <button type="button" class="btn btn-outline"
                            onclick="selectDate('{{ tomorrow|date:'Y-m-d' }}',this)">
                            <span>Tomorrow</span>
                            <span class="text-lg font-bold">{{ tomorrow|date:"d M"}}</span>
                        </button>

                        <button type="button" class="btn btn-outline"
                            onclick="selectDate('{{ day_after|date:'Y-m-d' }}',this)">
                            <span>{{ day_after|date:"D"}}</span>
                            <span class="text-lg font-bold">{{ day_after|date:"d M" }}</span>
                        </button>
                    </div>

                    <h4 style="margin-bottom: 1rem;">Select Time</h4>
                    <div class="grid grid-cols-3 grid-gap">
                        <button type="button" class="btn btn-outline" onclick="selectTime('09:00',this)">09:00 AM</button>
                        {% comment %} <button type="button" class="btn btn-outline" onclick="selectTime('10:00',this)" style="background: var(--color-primary-light);">10:00
                            AM</button> {% endcomment %}
                        <button type="button" class="btn btn-outline" onclick="selectTime('10:00',this)">10:00
                            AM</button>
                        <button type="button" class="btn btn-outline" onclick="selectTime('11:00',this)">11:00 AM</button>
                        <button type="button" class="btn btn-outline" onclick="selectTime('01:00',this)">01:00 PM</button>
                        <button type="button" class="btn btn-outline" onclick="selectTime('03:00',this)">03:00 PM</button>
                        <button type="button" class="btn btn-outline" onclick="selectTime('05:00',this)">05:00 PM</button>
                    </div>
                </div>

                <div class="flex justify-between">
                    <a href="{% url 'services_detail' service.id %}" class="btn btn-secondary">Back</a>
                    <button type="submit" class="btn btn-primary">Next: Select Address</button>
                </div>
            </form>
            </div>

            <!-- JS -->
            <script>
            function selectDate(date, btn) {
                document.getElementById('booking_date').value = date;

                document.querySelectorAll('[onclick^="selectDate"]').forEach(b => {
                    b.classList.remove('btn-primary');
                    b.classList.add('btn-outline');
                });

                btn.classList.remove('btn-outline');
                btn.classList.add('btn-primary');
            }

            function selectTime(time, btn) {
                document.getElementById('booking_time').value = time;

                document.querySelectorAll('[onclick^="selectTime"]').forEach(b => {
                    b.classList.remove('btn-primary');
                    b.classList.add('btn-outline');
                });

                btn.classList.remove('btn-outline');
                btn.classList.add('btn-primary');
            }
            </script>

        {% endblock %}

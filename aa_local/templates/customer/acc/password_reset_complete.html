{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Reset Successful | Local Service Booking</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>

    <div class="auth-container">
        <div class="auth-card">

            <div class="auth-header">
                <a href="{% url 'home' %}" class="logo justify-center" style="margin-bottom: 1rem;">
                    <i class="fa-solid fa-bolt text-primary"></i>
                    <span>Local Service Booking</span>
                </a>

                <div style="margin-bottom: 1.5rem; text-align: center;">
                    <i class="fa-solid fa-circle-check text-success" style="font-size: 3rem; color: #28a745;"></i>
                </div>

                <h2 style="font-size: 1.5rem; margin-bottom: 0.5rem;">Password Reset Successful</h2>
                <p class="text-light" style="margin-bottom: 1.5rem;">
                    Your password has been updated successfully.<br>
                    You can now log in using your new password.
                </p>
            </div>

            <div class="form-group">
                <a href="{% url 'customer_login' %}" class="btn btn-primary btn-block"
                    style="text-decoration: none; display: block; text-align: center;">Go to Login</a>
            </div>

        </div>
    </div>

</body>

</html>

{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | Local Service Booking</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>

    <div class="auth-container">
        <div class="auth-card">

            {% if messages %}
            <div class="messages" style="margin-bottom: 1rem;">
                {% for message in messages %}
                <div class="alert {{ message.tags }}"
                    style="padding: 0.75rem; border-radius: 0.5rem; margin-bottom: 0.5rem; background-color: #f8f9fa; border: 1px solid #dee2e6;">
                    {{ message }}
                </div>
                {% endfor %}
            </div>
            {% endif %}

            <div class="auth-header">
                <a href="{% url 'home' %}" class="logo justify-center" style="margin-bottom: 1rem;">
                    <i class="fa-solid fa-bolt text-primary"></i>
                    <span>Local Service Booking</span>
                </a>
                <h2 style="font-size: 1.5rem; margin-bottom: 0.5rem;">Reset Password</h2>
                <p class="text-light">Enter your email to receive a password reset link</p>
            </div>

            <form method="POST">
                {% csrf_token %}
                <div class="form-group">
                    <label class="form-label">Email Address</label>
                    <input type="email" name="email" class="form-control" placeholder="john@example.com" required>
                </div>

                <div class="form-group">
                    <button type="submit" class="btn btn-primary btn-block">Send Reset Link</button>
                </div>

                <div class="text-center">
                    <a href="{% url 'customer_login' %}" class="text-primary font-bold">Back to Login</a>
                </div>
            </form>
        </div>
    </div>

</body>

</html>

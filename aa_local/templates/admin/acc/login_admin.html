{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Partner Login | Local Services</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
</head>

<body style="background-color: #0F172A;">

    <div class="auth-container" style="background-color: #1E293B;">
        <div class="auth-card">
            <div class="auth-header"> 
                <a href="index.html" class="logo justify-center" style="margin-bottom: 1rem;">
                    <i class="fa-solid fa-bolt text-primary"></i>
                    <span style="color: #0F172A;">LocalServe</span>
                </a>
                <h2 style="font-size: 1.5rem; margin-bottom: 0.5rem;">Partner Portal</h2>
                <p class="text-light">Access your business dashboard</p>
            </div>

            {% if messages %}
        {% for message in messages %}
            <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
        {% endfor %}
        {% endif %}




            <form method="post">
                {% csrf_token %}
                <div class="form-group">
                    <label class="form-label">Admin/Partner ID</label>
                    <input type="text" class="form-control" name="username" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Password</label>
                    <input type="password" class="form-control" name = "password" required>
                </div>

                <div class="form-group">
                    <button type="submit" class="btn btn-primary btn-block">Login to Dashboard</button>
                </div>

                <div class="text-center">
                    <a href="{% url 'home' %}" class="text-sm text-light hover:text-primary">Back to Home</a>
                </div>
            </form>
        </div>
    </div>

</body>

</html>

{% extends "base_admin.html" %}
{% block title %}Admin Edit Service{% endblock %}

        <!-- Main Content -->
        {% block content %}
            <!-- Breadcrumbs -->
            <div class="breadcrumbs">
                <a href="{% url "admin_services" %}">Services</a> &gt; Edit Service
            </div>

            <div class="flex justify-between items-center" style="margin-bottom: 2rem;">
                <h2>Edit Service</h2>
            </div>

            <!-- Add Service Form -->
            <div class="card" style="max-width: 800px; margin: 0 auto;">
                <form action="{% url "edit_service" services.id %}" method="post" enctype="multipart/form-data"> <!-- Simulating form submission redirect -->
                    {% csrf_token %} 
                    <!-- Service Name -->
                    <div class="form-group">
                        <label class="form-label">Service Name <span class="text-danger">*</span></label>
                        <input type="text" class="form-control"  value={{services.title}} name = "title" required>
                    </div>

                    <!-- Service Category -->
                    
                    <div class="form-group">
                        <label class="form-label">Service Category <span class="text-danger">*</span></label>
                        <select name="category" class="form-control" required>
                            <option value="">Select category</option>
                            {% for cat in categories %}
                                <option value="{{ cat.id }}" {% if services.category.id == cat.id %}selected{% endif %}>{{ cat.name }}</option>
                            {% endfor %}
                        </select>
                    </div>


                    <!-- Price & Duration Row -->
                    <div class="grid grid-cols-2 gap-md">
                        <div class="form-group">
                            <label class="form-label">Price <span class="text-danger">*</span></label>
                            <input type="number" class="form-control" value={{ services.price }} name="price" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Estimated Duration</label>
                            <input type="text" class="form-control" value="{{ services.duration_minutes }}" name="duration_minutes">
                        </div>
                    </div>

                    <!-- Service Description -->
                    <div class="form-group">
                        <label class="form-label">Service Description <span class="text-danger">*</span></label>
                        <textarea class="form-control" rows="4"
                            placeholder="Describe what is included in this service..." name="description" required>{{ services.description }}</textarea>
                    </div>

                    
                    
                    <div class="form-group">
                        <label class="form-label">Service Image</label>
                        {% if services.image %}
                            <div style="margin-bottom: 10px;">
                                <p class="text-sm">Current Image:</p>
                                <img src="{{ services.image.url }}"
                                    alt="Service Image"
                                    style="width:120px; border-radius:8px;">
                            </div>
                        {% endif %}
                        <input type="file" class="form-control" name="image">
                    </div>

                    <!-- Service Status -->
                    <div class="form-group">
                        <label class="form-label" style="margin-bottom: 0.5rem;">Service Status</label>
                        <div class="flex gap-lg">
                            <label class="flex items-center gap-sm" style="cursor: pointer;">
                                <input type="radio" name="status" value="active" {% if services.is_active %}checked{% endif %}>
                                <span>Active</span>
                            </label>
                            <label class="flex items-center gap-sm" style="cursor: pointer;">
                                <input type="radio" name="status" value="inactive" {% if not services.is_active %}checked{% endif %}>
                                <span>Inactive</span>
                            </label>
                        </div>
                    </div>

                    <!-- Form Actions -->
                    <div class="flex justify-between items-center" style="margin-top: 2rem;">
                        <a href="{% url "admin_services" %}" class="btn btn-secondary">Cancel</a>
                        <button type="submit" class="btn btn-primary">Save Service</button>
                    </div>

                </form>
            </div>
        {%  endblock %}
